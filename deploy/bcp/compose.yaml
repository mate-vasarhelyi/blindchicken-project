name: openproject

services:
  openproject:
    image: ${IMAGE_REF:?Set a digest-pinned IMAGE_REF in the deploy helper}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8096}:80"
    env_file:
      - path: ${BCP_RUNTIME_ENV_FILE:?Generated by the deploy helper}
        format: raw
    environment:
      APP_DATA_PATH: /var/openproject/assets
      OPENPROJECT_ATTACHMENTS__STORAGE__PATH: /var/openproject/assets/files
      OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: auto
      OPENPROJECT_EDITION: standard
      OPENPROJECT_EE__HIDE__BANNERS: "true"
      OPENPROJECT_EE__MANAGER__VISIBLE: "false"
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOSTNAME:?Set OPENPROJECT_HOSTNAME}
      OPENPROJECT_HTTPS: "true"
      PGDATA: /var/openproject/pgdata
      PGVERSION: "17"
      SERVER_NAME: ${OPENPROJECT_HOSTNAME:?Set OPENPROJECT_HOSTNAME}
    volumes:
      - type: bind
        source: "${DATA_ROOT:?Set DATA_ROOT}/postgres"
        target: /var/openproject/pgdata
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_ROOT:?Set DATA_ROOT}/assets"
        target: /var/openproject/assets
        bind:
          create_host_path: false
